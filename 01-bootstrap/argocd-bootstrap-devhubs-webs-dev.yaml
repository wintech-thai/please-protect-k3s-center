apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-devhubs-webs-dev
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          custom: "true"
  template:
    metadata:
      name: 'bootstrap-devhubs-webs-dev'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/wintech-thai/devhubs-webs-control-plane.git
        targetRevision: "development" #Based on environment
        path: '.'
        helm:
          releaseName: devhubs-webs-dev
          ignoreMissingValueFiles: true
          valueFiles:
            - values-files/values-development.yaml

            # please-payment-web
            - values-files/please-payment-web/please-payment-web-00-values.yaml
            - values-files/please-payment-web/please-payment-web-01-development-values.yaml
            - values-files/please-payment-web/please-payment-web-03-development-image-tag.yaml

            # please-protect-portal
            - values-files/please-protect-portal/please-protect-portal-00-values.yaml
            - values-files/please-protect-portal/please-protect-portal-01-development-values.yaml
            - values-files/please-protect-portal/please-protect-portal-03-development-image-tag.yaml

            # please-scan-web
            - values-files/please-scan-web/please-scan-web-00-values.yaml
            - values-files/please-scan-web/please-scan-web-01-development-values.yaml
            - values-files/please-scan-web/please-scan-web-03-development-image-tag.yaml

            # dev-hubs-web
            - values-files/dev-hubs-web/dev-hubs-web-00-values.yaml
            - values-files/dev-hubs-web/dev-hubs-web-01-development-values.yaml
            - values-files/dev-hubs-web/dev-hubs-web-03-development-image-tag.yaml

      destination:
        name: in-cluster
        namespace: devhubs-webs-development
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
