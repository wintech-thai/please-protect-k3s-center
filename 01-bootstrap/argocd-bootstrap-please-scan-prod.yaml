apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-please-scan-prod
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          custom: "true"
  template:
    metadata:
      name: 'bootstrap-please-scan-prod'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/wintech-thai/please-scan-control-plane.git
        targetRevision: "production" #Based on environment
        path: '.'
        helm:
          releaseName: please-scan-prod
          ignoreMissingValueFiles: true
          valueFiles:
            - values-files/values-production.yaml

            # redis
            - values-files/redis/redis-00-values.yaml

            # onix-jobs
            - values-files/onix-jobs/onix-jobs-00-values.yaml
            - values-files/onix-jobs/onix-jobs-01-production-values.yaml
            - values-files/onix-jobs/onix-jobs-03-production-image-tag.yaml

            # onix-api
            - values-files/onix-api/onix-api-00-values.yaml
            - values-files/onix-api/onix-api-01-production-values.yaml
            - values-files/onix-api/onix-api-03-production-image-tag.yaml

            # tenant
            - values-files/please-scan-tenant/please-scan-tenant-00-values.yaml
            - values-files/please-scan-tenant/please-scan-tenant-01-production-values.yaml
            - values-files/please-scan-tenant/please-scan-tenant-03-production-image-tag.yaml

            # verify
            - values-files/please-scan-verify/please-scan-verify-00-values.yaml
            - values-files/please-scan-verify/please-scan-verify-01-production-values.yaml
            - values-files/please-scan-verify/please-scan-verify-03-production-image-tag.yaml

            # register
            - values-files/please-scan-register/please-scan-register-00-values.yaml
            - values-files/please-scan-register/please-scan-register-01-production-values.yaml
            - values-files/please-scan-register/please-scan-register-03-production-image-tag.yaml


      destination:
        name: in-cluster
        namespace: please-scan-production
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
